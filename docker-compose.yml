# Local PostgreSQL for development only.
services:
  db:
    image: postgres:17-alpine
    container_name: aneakajun-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aneakajun
      POSTGRES_PASSWORD: aneakajun
      POSTGRES_DB: aneakajun_hub
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - aneakajun-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aneakajun -d aneakajun_hub"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  aneakajun-hub-pgdata:
